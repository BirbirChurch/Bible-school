        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCri6WGB2cmmbJ1mX5XSNnf15auoZSKsxc",
            authDomain: "bible-school-418d7.firebaseapp.com",
            projectId: "bible-school-418d7",
            storageBucket: "bible-school-418d7.firebasestorage.app",
            messagingSenderId: "855218354182",
            appId: "1:855218354182:web:bbc0fbd05b152f3f37eb87"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        signInAnonymously(auth).then(() => {
            document.getElementById('dbStatusText').innerText = "Firebase Connected";
            document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-emerald-400";
            window.firebaseConnected = true;
        }).catch((err) => {
            console.error("Firebase Error:", err);
            document.getElementById('dbStatusText').innerText = "Local Mode";
        });
    </script>

                const password = prompt("እባክዎ የመምህር የይለፍ ቃል (Password) ያስገቡ፦ (ምሳሌ፦ 123)");
                const matchedTeacher = appState.teachers.find(t => t.password === password);
                if (matchedTeacher) {
                    appState.currentRole = 'teacher';
                    appState.loggedInTeacher = matchedTeacher;
                    appState.activeTab = 'courses';
                    alert(`እንኳን ደህና መጡ ${matchedTeacher.name}!`);
                } else {
                    alert("የተሳሳተ የይለፍ ቃል ነው!");
                    document.getElementById('roleSelector').value = 'admin';
                    return;
                }
            } else {
                appState.currentRole = 'admin';
                appState.loggedInTeacher = null;
                appState.activeTab = 'dashboard';
            }

            document.getElementById('currentUserDisplay').innerText = 
                appState.currentRole === 'admin' ? 'ሲስተም አስተዳዳሪ' : appState.loggedInTeacher.name;

            renderNavigation();
            renderTabContent();

            e.preventDefault();
            appState.teachers.push({

        function exportToExcel() {
            const data = appState.students.filter(s => s.program === appState.activeProgram).map(s => ({
                "መለያ ኮድ (ID)": s.id, "የተማሪው ስም": s.name, "ጾታ": s.gender, "ፕሮግራም": s.program, "ዓመት": s.year, "ሴሚስተር": s.semester
            }));
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Students");
            XLSX.writeFile(workbook, `Birbir_Students_${appState.activeProgram}.xlsx`);
        }

        function importExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);
                json.forEach(row => {
                    appState.students.push({
                        id: String(row["መለያ ኮድ (ID)"] || Date.now()),
                        name: row["የተማሪው ስም"] || "ስም የሌለው",
                        gender: row["ጾታ"] || "ወ",
                        program: appState.activeProgram,
                        year: 1,
                        semester: 1,
                        grades: {}
                    });
                });
                alert("የExcel ፋይል ተጭኗል!");
                renderTabContent();
            };
            reader.readAsArrayBuffer(file);
        }

        function downloadStudentPdf() {
            const studentId = document.getElementById('selectedStudentPdf').value;

            if (!student) { alert("እባክዎ ተማሪ ይምረጡ!"); return; }

            const printArea = document.getElementById('printableArea');
            printArea.innerHTML = `
                <div style="text-align: center; font-family: 'Noto Sans Ethiopic', sans-serif;">
                    <h2>የብርብር ቃለ ሕይወት ቤተክርስቲያን የማታ መጽሐፍ ቅዱስ ትምህርት ቤት</h2>
                    <h3>የተማሪ ውጤት መግለጫ (Student Transcript)</h3>
                    <hr style="margin: 15px 0;">
                    <div style="text-align: left; margin-bottom: 20px;">
                        <p><strong>የተማሪው ስም፦</strong> ${student.name}</p>
                        <p><strong>መለያ ኮድ (ID)፦</strong> ${student.id}</p>
                        <p><strong>ፕሮግራም፦</strong> ${student.program} (${student.year}ኛ ዓመት)</p>
                    </div>
                    <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead><tr style="background-color: #f2f2f2;"><th style="padding: 8px;">ኮርስ</th><th style="padding: 8px;">ውጤት (%)</th></tr></thead>
                        <tbody>
                            ${Object.entries(student.grades).map(([code, score]) => `<tr><td style="padding: 8px;">${code}</td><td style="padding: 8px;">${score}%</td></tr>`).join('') || '<tr><td colspan="2" style="padding:8px; text-align:center;">ውጤት የለም።</td></tr>'}
                        </tbody>
                    </table>
                </div>
            `;
            window.print();
        }

        window.onload = initApp;
    </script>
</body>
