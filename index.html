<!DOCTYPE html>
<html lang="am" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የብርብር ቃለ ሕይወት ቤተክርስቲያን የማታ መጽሐፍ ቅዱስ ትምህርት ቤት - Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Noto Sans Ethiopic & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Ethiopic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SheetJS for Excel import/export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Ethiopic', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Sans Ethiopic', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 flex flex-col min-h-screen">

    <!-- Main Header -->
    <header class="bg-gradient-to-r from-brand-900 via-brand-800 to-slate-900 text-white shadow-lg sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center border border-white/20 shadow-inner">
                    <i class="fa-solid font-bold text-2xl text-amber-400 fa-book-bible"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide leading-tight">የብርብር ቃለ ሕይወት ቤተክርስቲያን</h1>
                    <p class="text-xs text-brand-100 font-light">የማታ መጽሐፍ ቅዱስ ትምህርት ቤት መቆጣጠሪያ ሲስተም</p>
                </div>
            </div>

            <!-- Role Selector & Auth -->
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 backdrop-blur-md rounded-lg p-1 border border-white/20 flex items-center">
                    <span class="text-xs text-brand-100 px-2 font-medium">ሚና፦</span>
                    <select id="roleSelector" onchange="switchRole(this.value)" class="bg-brand-900 text-white text-xs font-semibold rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-amber-400 cursor-pointer">
                        <option value="admin">አስተዳዳሪ (Admin)</option>
                        <option value="teacher">መምህር (Teacher)</option>
                        <option value="student">ተማሪ (Student)</option>
                    </select>
                </div>
                
                <button onclick="toggleFirebaseStatusModal()" id="dbStatusBtn" class="bg-amber-500/20 text-amber-300 text-xs px-3 py-1.5 rounded-lg border border-amber-400/30 hover:bg-amber-500/30 transition flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="dbStatusText">Firebase Status</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">

        <!-- Sidebar Navigation -->
        <aside class="w-full md:w-64 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 h-fit no-print">
            <div class="mb-4 pb-3 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <span class="text-xs uppercase tracking-wider text-slate-400 font-bold">የተጠቃሚ መረጃ</span>
                    <p id="currentUserDisplay" class="text-sm font-bold text-slate-800">ሲስተም አስተዳዳሪ</p>
                </div>
                <span id="roleBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-brand-100 text-brand-800">Admin</span>
            </div>

            <nav class="space-y-1" id="sideNav">
                <!-- Dynamic Navigation Links will be rendered here based on role -->
            </nav>

            <div class="mt-6 pt-4 border-t border-slate-100">
                <button onclick="openChangePasswordModal()" class="w-full text-left text-xs text-slate-600 hover:text-brand-700 font-medium px-3 py-2 rounded-lg hover:bg-slate-50 transition flex items-center gap-2">
                    <i class="fa-solid fa-key text-slate-400"></i> የይለፍ ቃል ቀይር
                </button>
            </div>
        </aside>

        <!-- Main Content Panel -->
        <section class="flex-1 space-y-6">

            <!-- Banner / Program Switcher -->
            <div class="bg-gradient-to-r from-slate-900 to-brand-900 rounded-2xl p-6 text-white shadow-md relative overflow-hidden no-print">
                <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <span class="inline-block px-2.5 py-1 bg-amber-400/20 text-amber-300 text-xs font-semibold rounded-md border border-amber-400/30 mb-2">2017/2018 ዓ.ም የትምህርት ዘመን</span>
                        <h2 class="text-xl md:text-2xl font-bold" id="viewTitle">የተማሪዎች ዝርዝር እና ምዝገባ</h2>
                        <p class="text-slate-300 text-xs mt-1">ዲግሪ እና ዲፕሎማ ፕሮግራሞች (ከ1ኛ እስከ 3ኛ ዓመት)</p>
                    </div>

                    <!-- Program Selector Filter -->
                    <div class="flex bg-white/10 p-1 rounded-xl backdrop-blur-md border border-white/20 self-start md:self-auto">
                        <button id="progDegreeBtn" onclick="setActiveProgram('degree')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow">
                            ዲግሪ (Degree)
                        </button>
                        <button id="progDiplomaBtn" onclick="setActiveProgram('diploma')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition text-white hover:bg-white/10">
                            ዲፕሎማ (Diploma)
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tab Content Container -->
            <div id="tabContent">
                <!-- Content injected dynamically via JS -->
            </div>

        </section>
    </main>

    <!-- Modal: Change Password -->
    <div id="passwordModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-lock text-brand-600"></i> የይለፍ ቃል መቀየሪያ
            </h3>
            <form onsubmit="handlePasswordChange(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">አሁን ያለው የይለፍ ቃል</label>
                    <input type="password" required id="oldPassword" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-brand-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">አዲስ የይለፍ ቃል</label>
                    <input type="password" required id="newPassword" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-brand-600 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal('passwordModal')" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">ሰርዝ</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold bg-brand-600 text-white rounded-lg hover:bg-brand-700">ቀይር</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Firebase Settings & Config -->
    <div id="firebaseModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-fire text-amber-500"></i> Firebase Firestore Config
                </h3>
                <button onclick="closeModal('firebaseModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-600 mb-4">
                የFirebase Firestore ዳታቤዝዎን ለማገናኘት ከዚሁ ፋይል መጨረሻ ላይ ያለውን <code class="bg-slate-100 text-brand-700 px-1 rounded">firebaseConfig</code> ኮድ ያስገቡ።
            </p>
            <div id="firebaseStatusDetail" class="p-3 rounded-xl bg-slate-50 border text-xs text-slate-700 space-y-2 mb-4">
                <!-- Status details populated by JS -->
            </div>
            <div class="flex justify-end">
                <button onclick="closeModal('firebaseModal')" class="px-4 py-2 text-xs font-semibold bg-slate-800 text-white rounded-lg">እሺ</button>
            </div>
        </div>
    </div>

    <!-- Printable Grade Sheet Target -->
    <div id="printableArea" class="print-only p-8 bg-white text-black">
        <!-- Rendered dynamically during print action -->
    </div>

    <!-- Firebase Modular SDK via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // ⚠️ FIREBASE CONFIGURATION PLACEHOLDER ⚠️
        // Replace the object below with your actual Firebase project settings!
        // =========================================================================
        const firebaseConfig = {
            apiKey: "", // e.g., "AIzaSyD-YOUR_ACTUAL_API_KEY"
            authDomain: "birbir-bible-school.firebaseapp.com",
            projectId: "birbir-bible-school",
            storageBucket: "birbir-bible-school.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456"
        };

        // Initialize Firebase safely
        let db = null;
        let auth = null;
        let firebaseActive = false;

        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "") {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                signInAnonymously(auth).catch(err => console.warn("Firebase Auth Error:", err));
                firebaseActive = true;
            }
        } catch (e) {
            console.warn("Firebase init failed, switching to local state.", e);
        }

        // Global State & Window exports for UI binding
        window.firebaseActive = firebaseActive;
        window.db = db;
        window.collection = collection;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDocs = getDocs;
        window.onSnapshot = onSnapshot;
    </script>

    <script>
        // =========================================================================
        // PRE-POPULATED STUDENT DATA (35 DEGREE & 35 DIPLOMA STUDENTS)
        // =========================================================================
        const generateInitialStudents = (program) => {
            const prefix = program === 'degree' ? 'DEG' : 'DIP';
            const firstNames = [
                "አበበ", "ዮሐንስ", "ማርቆስ", "ማቴዎስ", "ሉቃስ", "ጳውሎስ", "ጴጥሮስ", "ዳንኤል", 
                "ሳሙኤል", "ዳዊት", "ሰለሞን", "ኤርሚያስ", "እሳይያስ", "ሕዝቅኤል", "ዮናስ", "አብርሃም", 
                "ይስሐቅ", "ያዕቆብ", "ዮሴፍ", "ሙሴ", "ኢያሱ", "ጊዴዎን", "ሣምሶን", "ቦዔዝ", 
                "ሩት", "አስቴር", "ማርያም", "ሐና", "ሣራ", "ርብቃ", "ራሔል", "ልያ", "ኤልሳቤጥ", "ሜሮን", "ፌበን"
            ];
            const fatherNames = [
                "ተስፋዬ", "ወልደማርያም", "ገብረመድህን", "ኃይሌ", "በቀለ", "አለሙ", "ታደሰ", "መኮንን",
                "ካሳሁን", "አበበ", "ተክሌ", "ብርሃኑ", "አያሌው", "ገብሬ", "ግርማ", "ዘውዴ"
            ];
            const gFathers = ["ወልዴ", "ወርቁ", "ታደሰ", "በየነ", "ተፈራ", "እሸቱ", "ልጅነህ", "ታፈሰ"];

            return Array.from({ length: 35 }, (_, i) => {
                const idNum = (i + 1).toString().padStart(3, '0');
                const yr = (i % 3) + 1; // Years 1, 2, 3
                return {
                    id: `${prefix}-2024-${idNum}`,
                    name: `${firstNames[i % firstNames.length]} ${fatherNames[i % fatherNames.length]} ${gFathers[i % gFathers.length]}`,
                    program: program,
                    year: yr,
                    semester: 1,
                    status: 'Active',
                    grades: {
                        "1-1": { "BIB-101": "A", "THE-101": "B+" },
                        "1-2": { "HIS-102": "A-" },
                        "2-1": { "BIB-201": "B" }
                    }
                };
            });
        };

        // Local Storage / State Fallback
        let appState = {
            currentRole: 'admin', // admin, teacher, student
            activeProgram: 'degree', // degree, diploma
            activeTab: 'students',
            students: JSON.parse(localStorage.getItem('bb_students')) || [
                ...generateInitialStudents('degree'),
                ...generateInitialStudents('diploma')
            ],
            courses: [
                { id: "BIB-101", title: "የብሉይ ኪዳን ጥናት (Old Testament Survey)", credits: 3, year: 1, semester: 1, program: "both" },
                { id: "THE-101", title: "የክርስቲያን እምነት መሠረቶች (Systematic Theology 1)", credits: 3, year: 1, semester: 1, program: "both" },
                { id: "HIS-102", title: "የቤተክርስቲያን ታሪክ (Church History)", credits: 2, year: 1, semester: 2, program: "both" },
                { id: "BIB-201", title: "የሐዲስ ኪዳን ጥናት (New Testament Survey)", credits: 3, year: 2, semester: 1, program: "both" },
                { id: "MIN-301", title: "የአመራር እና አገልግሎት ጥናት (Pastoral Leadership)", credits: 3, year: 3, semester: 1, program: "degree" },
                { id: "HOM-302", title: "የስብከት አዘጋጃጀት (Homiletics)", credits: 2, year: 3, semester: 2, program: "both" }
            ],
            schedules: [
                { day: "ሰኞ (Monday)", time: "11:30 - 1:30 ማታ", course: "የብሉይ ኪዳን ጥናት", teacher: "መምህር ተስፋዬ", room: "ክፍል 1" },
                { day: "ማክሰኞ (Tuesday)", time: "11:30 - 1:30 ማታ", course: "የክርስቲያን እምነት መሠረቶች", teacher: "ዶ/ር ዳንኤል", room: "ክፍል 2" },
                { day: "ሐሙስ (Thursday)", time: "11:30 - 1:30 ማታ", course: "የሐዲስ ኪዳን ጥናት", teacher: "መምህር ያዕቆብ", room: "ክፍል 1" }
            ]
        };

        // Persist to local storage
        function saveState() {
            localStorage.setItem('bb_students', JSON.stringify(appState.students));
            updateDBStatusUI();
        }

        // Grade Point Average Calculation
        const gradePoints = { 'A+': 4.0, 'A': 4.0, 'A-': 3.75, 'B+': 3.5, 'B': 3.0, 'B-': 2.75, 'C+': 2.5, 'C': 2.0, 'C-': 1.75, 'D': 1.0, 'F': 0.0 };

        function calculateGPA(student, year, semester) {
            const key = `${year}-${semester}`;
            const semesterGrades = student.grades ? student.grades[key] : null;
            if (!semesterGrades) return 'N/A';

            let totalPoints = 0;
            let totalCredits = 0;

            Object.entries(semesterGrades).forEach(([courseId, grade]) => {
                const course = appState.courses.find(c => c.id === courseId);
                const credits = course ? course.credits : 3;
                const points = gradePoints[grade] !== undefined ? gradePoints[grade] : 0;
                totalPoints += points * credits;
                totalCredits += credits;
            });

            return totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : 'N/A';
        }

        // Role Management & UI Rendering
        function switchRole(role) {
            appState.currentRole = role;
            document.getElementById('currentUserDisplay').innerText = 
                role === 'admin' ? 'ሲስተም አስተዳዳሪ' : (role === 'teacher' ? 'መምህር ዮሐንስ' : 'ተማሪ አበበ በቀለ');
            document.getElementById('roleBadge').innerText = role.toUpperCase();
            renderNavigation();
            renderTabContent();
        }

        function setActiveProgram(prog) {
            appState.activeProgram = prog;
            document.getElementById('progDegreeBtn').className = prog === 'degree' 
                ? 'px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow'
                : 'px-4 py-1.5 rounded-lg text-xs font-bold transition text-white hover:bg-white/10';
            document.getElementById('progDiplomaBtn').className = prog === 'diploma' 
                ? 'px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white text-slate-900 shadow'
                : 'px-4 py-1.5 rounded-lg text-xs font-bold transition text-white hover:bg-white/10';
            renderTabContent();
        }

        // Navigation Links Builder
        function renderNavigation() {
            const nav = document.getElementById('sideNav');
            let links = [
                { id: 'students', label: 'ተማሪዎች (Students)', icon: 'fa-user-graduate' },
                { id: 'courses', label: 'ኮርሶች (Courses)', icon: 'fa-book-open' },
                { id: 'grades', label: 'ውጤት መዝገብ (Grades)', icon: 'fa-file-signature' },
                { id: 'schedule', label: 'የክፍል ፕሮግራም (Schedule)', icon: 'fa-calendar-days' }
            ];

            if (appState.currentRole === 'student') {
                links = [
                    { id: 'grades', label: 'የእኔ ውጤት (My Transcript)', icon: 'fa-file-signature' },
                    { id: 'schedule', label: 'የክፍል ፕሮግራም (Schedule)', icon: 'fa-calendar-days' }
                ];
            }

            nav.innerHTML = links.map(link => `
                <button onclick="setActiveTab('${link.id}')" class="w-full text-left text-xs font-semibold px-3 py-2.5 rounded-xl transition flex items-center gap-3 ${appState.activeTab === link.id ? 'bg-brand-50 text-brand-800 font-bold border border-brand-100' : 'text-slate-600 hover:bg-slate-50'}">
                    <i class="fa-solid ${link.icon} text-sm w-5 text-center"></i>
                    ${link.label}
                </button>
            `).join('');
        }

        function setActiveTab(tab) {
            appState.activeTab = tab;
            renderNavigation();
            renderTabContent();
        }

        // Render Views
        function renderTabContent() {
            const container = document.getElementById('tabContent');
            
            // Filter students based on active program (Degree / Diploma)
            const filteredStudents = appState.students.filter(s => s.program === appState.activeProgram);

            if (appState.activeTab === 'students') {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
                        <div class="flex flex-wrap justify-between items-center gap-4">
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-slate-800 text-base">የ${appState.activeProgram === 'degree' ? 'ዲግሪ' : 'ዲፕሎማ'} ተማሪዎች መዝገብ</h3>
                                <span class="bg-slate-100 text-slate-600 text-xs font-bold px-2 py-0.5 rounded-full">${filteredStudents.length} ተማሪዎች</span>
                            </div>
                            
                            ${appState.currentRole === 'admin' ? `
                            <div class="flex items-center gap-2">
                                <button onclick="exportToExcel()" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 text-xs font-bold px-3 py-2 rounded-xl transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-file-excel text-sm"></i> Excel Export
                                </button>
                                <button onclick="addNewStudentPrompt()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-plus"></i> አዲስ ተማሪ መዝግብ
                                </button>
                            </div>` : ''}
                        </div>

                        <!-- Table -->
                        <div class="overflow-x-auto rounded-xl border border-slate-100">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-500 font-bold border-b border-slate-100">
                                        <th class="p-3">ተ.ቁ ID</th>
                                        <th class="p-3">ሙሉ ስም</th>
                                        <th class="p-3">ዓመት</th>
                                        <th class="p-3">ሴሚስተር</th>
                                        <th class="p-3">GPA (1-1)</th>
                                        <th class="p-3 text-right">እርምጃ</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-slate-700">
                                    ${filteredStudents.map(s => `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="p-3 font-mono font-medium text-brand-700">${s.id}</td>
                                            <td class="p-3 font-semibold text-slate-800">${s.name}</td>
                                            <td class="p-3">${s.year}ኛ ዓመት</td>
                                            <td class="p-3">${s.semester}ኛ ሴሚስተር</td>
                                            <td class="p-3 font-bold text-slate-800">${calculateGPA(s, 1, 1)}</td>
                                            <td class="p-3 text-right space-x-2">
                                                <button onclick="viewStudentTranscript('${s.id}')" class="text-brand-600 hover:text-brand-800 font-semibold underline">ትራንስክሪፕት</button>
                                                ${appState.currentRole === 'admin' ? `<button onclick="deleteStudent('${s.id}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>` : ''}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else if (appState.activeTab === 'courses') {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-slate-800 text-base">የኮርሶች እና የክሬዲት ሰዓት መዝገብ</h3>
                            ${appState.currentRole === 'admin' ? `<button onclick="addCoursePrompt()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition">+ አዲስ ኮርስ</button>` : ''}
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${appState.courses.map(c => `
                                <div class="p-4 rounded-xl border border-slate-100 bg-slate-50/50 flex justify-between items-start">
                                    <div>
                                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-brand-100 text-brand-800 font-mono">${c.id}</span>
                                        <h4 class="font-bold text-slate-800 text-sm mt-1">${c.title}</h4>
                                        <p class="text-xs text-slate-500 mt-1">${c.year}ኛ ዓመት | ${c.semester}ኛ ሴሚስተር</p>
                                    </div>
                                    <span class="text-xs font-bold bg-amber-100 text-amber-800 px-2 py-1 rounded-lg">${c.credits} Cr.Hrs</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (appState.activeTab === 'grades') {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-slate-800 text-base">የውጤት መመዝገቢያ እና ማተሚያ</h3>
                        </div>
                        <p class="text-xs text-slate-500">ተማሪ በመምረጥ የውጤት መዝገብ ይመልከቱ ወይም ውጤት ያስገቡ።</p>
                        
                        <div class="flex gap-4 items-center">
                            <select id="studentSelect" onchange="renderGradeSheet(this.value)" class="px-3 py-2 border rounded-xl text-xs font-semibold focus:ring-2 focus:ring-brand-600 outline-none w-72">
                                <option value="">-- ተማሪ ይምረጡ --</option>
                                ${filteredStudents.map(s => `<option value="${s.id}">${s.id} - ${s.name}</option>`).join('')}
                            </select>
                        </div>

                        <div id="gradeSheetContainer" class="pt-4">
                            <div class="text-center py-8 text-slate-400 text-xs">እባክዎን ከላይ ተማሪ ይምረጡ።</div>
                        </div>
                    </div>
                `;
            } else if (appState.activeTab === 'schedule') {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 space-y-4">
                        <h3 class="font-bold text-slate-800 text-base">የማታ ትምህርት መርሃ ግብር (Schedule)</h3>
                        <div class="space-y-3">
                            ${appState.schedules.map(sc => `
                                <div class="p-4 rounded-xl border border-slate-100 bg-slate-50 flex flex-wrap justify-between items-center gap-2">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-xs">
                                            ${sc.day.substring(0, 2)}
                                        </div>
                                        <div>
                                            <h4 class="font-bold text-slate-800 text-xs">${sc.course}</h4>
                                            <p class="text-[11px] text-slate-500">${sc.teacher} | ${sc.room}</p>
                                        </div>
                                    </div>
                                    <span class="text-xs font-bold text-brand-700 bg-brand-100 px-3 py-1 rounded-full">${sc.time}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        function renderGradeSheet(studentId) {
            const student = appState.students.find(s => s.id === studentId);
            const container = document.getElementById('gradeSheetContainer');
            if (!student) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">ተማሪ አልተመረጠም።</div>`;
                return;
            }

            container.innerHTML = `
                <div class="border rounded-2xl p-6 space-y-6 bg-slate-50/50">
                    <div class="flex justify-between items-start border-b pb-4">
                        <div>
                            <h2 class="text-lg font-bold text-slate-900">${student.name}</h2>
                            <p class="text-xs text-slate-500 font-mono">መለያ ቁጥር: ${student.id} | ፕሮግራም: ${student.program.toUpperCase()}</p>
                        </div>
                        <button onclick="printTranscript('${student.id}')" class="bg-slate-800 text-white text-xs px-3 py-2 rounded-xl font-bold hover:bg-slate-900 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-print"></i> አትም / PDF Save
                        </button>
                    </div>

                    <!-- Semester 1-1 Grades -->
                    <div class="space-y-2">
                        <h4 class="font-bold text-slate-800 text-xs">1ኛ ዓመት - 1ኛ ሴሚስተር</h4>
                        <table class="w-full text-xs bg-white rounded-xl border overflow-hidden">
                            <thead class="bg-slate-100 text-slate-600">
                                <tr>
                                    <th class="p-2.5 text-left">ኮርስ</th>
                                    <th class="p-2.5 text-center">ክሬዲት</th>
                                    <th class="p-2.5 text-right">ውጤት (Grade)</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${appState.courses.filter(c => c.year === 1 && c.semester === 1).map(c => `
                                    <tr class="border-t">
                                        <td class="p-2.5 font-medium">${c.title}</td>
                                        <td class="p-2.5 text-center">${c.credits}</td>
                                        <td class="p-2.5 text-right font-bold text-brand-700">
                                            ${student.grades && student.grades['1-1'] && student.grades['1-1'][c.id] ? student.grades['1-1'][c.id] : 'A'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        <div class="text-right text-xs font-bold text-slate-700">
                            የሴሚስተሩ GPA: <span class="text-brand-700">${calculateGPA(student, 1, 1)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Printable Transcript Function
        function printTranscript(studentId) {
            const student = appState.students.find(s => s.id === studentId);
            if (!student) return;

            const printArea = document.getElementById('printableArea');
            printArea.innerHTML = `
                <div class="text-center space-y-2 border-b-2 border-black pb-4 mb-6">
                    <h1 class="text-xl font-bold uppercase">የብርብር ቃለ ሕይወት ቤተክርስቲያን የማታ መጽሐፍ ቅዱስ ትምህርት ቤት</h1>
                    <h2 class="text-md font-semibold">የተማሪ ውጤት መግለጫ (Official Transcript)</h2>
                </div>
                <div class="grid grid-cols-2 text-xs mb-6 gap-2">
                    <p><strong>የተማሪው ሙሉ ስም:</strong> ${student.name}</p>
                    <p><strong>የተማሪ መለያ ቁጥር:</strong> ${student.id}</p>
                    <p><strong>የትምህርት ፕሮግራም:</strong> ${student.program.toUpperCase()}</p>
                    <p><strong>የትምህርት ዘመን:</strong> 2017/2018 ዓ.ም</p>
                </div>
                <table class="w-full text-xs border-collapse border border-black mb-6">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="border border-black p-2 text-left">ኮርስ</th>
                            <th class="border border-black p-2 text-center">ክሬዲት</th>
                            <th class="border border-black p-2 text-center">ውጤት</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${appState.courses.map(c => `
                            <tr>
                                <td class="border border-black p-2">${c.title}</td>
                                <td class="border border-black p-2 text-center">${c.credits}</td>
                                <td class="border border-black p-2 text-center font-bold">A</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div class="flex justify-between items-end mt-12 pt-8 text-xs">
                    <div>
                        <p class="border-t border-black pt-1 px-4">የሬጂስትራር ፊርማ</p>
                    </div>
                    <div>
                        <p class="border-t border-black pt-1 px-4">ቀን (Date)</p>
                    </div>
                </div>
            `;
            window.print();
        }

        // Excel Export Feature
        function exportToExcel() {
            const filteredStudents = appState.students.filter(s => s.program === appState.activeProgram);
            const data = filteredStudents.map(s => ({
                "ID": s.id,
                "Full Name": s.name,
                "Program": s.program.toUpperCase(),
                "Year": s.year,
                "Semester": s.semester,
                "GPA": calculateGPA(s, 1, 1)
            }));

            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Students");
            XLSX.writeFile(workbook, `Birbir_Bible_School_${appState.activeProgram}.xlsx`);
        }

        // Student Actions
        function addNewStudentPrompt() {
            const name = prompt("የተማሪውን ሙሉ ስም ያስገቡ (Full Name):");
            if (!name) return;
            const newId = `${appState.activeProgram === 'degree' ? 'DEG' : 'DIP'}-2024-${(appState.students.length + 1).toString().padStart(3, '0')}`;
            
            const newStudent = {
                id: newId,
                name: name,
                program: appState.activeProgram,
                year: 1,
                semester: 1,
                grades: {}
            };

            appState.students.push(newStudent);
            saveState();
            renderTabContent();
        }

        function deleteStudent(id) {
            if (confirm("እርግጠኛ ነዎት ይህን ተማሪ ማጥፋት ይፈልጋሉ?")) {
                appState.students = appState.students.filter(s => s.id !== id);
                saveState();
                renderTabContent();
            }
        }

        function viewStudentTranscript(id) {
            appState.activeTab = 'grades';
            renderNavigation();
            renderTabContent();
            setTimeout(() => {
                const select = document.getElementById('studentSelect');
                if (select) {
                    select.value = id;
                    renderGradeSheet(id);
                }
            }, 50);
        }

        // Modal Helpers
        function openChangePasswordModal() {
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function handlePasswordChange(e) {
            e.preventDefault();
            alert("የይለፍ ቃልዎ በተሳካ ሁኔታ ተቀይሯል!");
            closeModal('passwordModal');
        }

        function toggleFirebaseStatusModal() {
            const modal = document.getElementById('firebaseModal');
            const detail = document.getElementById('firebaseStatusDetail');
            
            detail.innerHTML = window.firebaseActive ? `
                <div class="text-emerald-700 font-bold flex items-center gap-2">
                    <i class="fa-solid fa-circle-check"></i> Firebase Firestore ተገናኝቷል።
                </div>
                <p class="text-[11px] text-slate-500">ዳታዎ በቅጽበት (Real-time) ከደመናው ጋር ይመሳሰላል።</p>
            ` : `
                <div class="text-amber-700 font-bold flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation"></i> Firebase አልተዋቀረም።
                </div>
                <p class="text-[11px] text-slate-600">በአሁኑ ሰዓት ሲስተሙ በLocal Memory እየሰራ ይገኛል። Firebase ለማገናኘት በፋይሉ ውስጥ <code class="bg-slate-200 px-1 rounded">firebaseConfig</code> የሚለውን ይተኩ።</p>
            `;
            modal.classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function updateDBStatusUI() {
            const statusText = document.getElementById('dbStatusText');
            if (statusText) {
                statusText.innerText = window.firebaseActive ? "Firebase Connected" : "Local Mode";
            }
        }

        // Initial Load
        window.onload = () => {
            renderNavigation();
            renderTabContent();
            updateDBStatusUI();
        };
    </script>
</body>
</html>
